name: Build and deploy website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: library
        name: Read the pinned documentation revision
        run: node --input-type=module -e "import fs from 'node:fs'; const m=JSON.parse(fs.readFileSync('content/library.json','utf8')); if(!/^[a-f0-9]{40}$/.test(m.commit)) throw Error('Invalid documentation commit'); fs.appendFileSync(process.env.GITHUB_OUTPUT,'commit='+m.commit+'\n');"
      - uses: actions/checkout@v4
        with:
          repository: aantich/oneringai
          ref: ${{ steps.library.outputs.commit }}
          path: .library-source
          persist-credentials: false
      - run: npm run docs:sync -- .library-source --frozen
      - run: npm run check
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
